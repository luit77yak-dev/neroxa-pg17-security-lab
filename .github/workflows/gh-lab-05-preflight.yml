name: GH-LAB-05 runner preflight (inactive candidate)

on:
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: gh-lab-05-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: none
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    env:
      BASH_ENV: /dev/null
      ENV: /dev/null
      LC_ALL: C
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Probe runner only; no PostgreSQL, Docker, SQL, or external actions
        id: probe
        run: |
          set -euo pipefail
          set +x
          : "${RUNNER_TEMP:?runner temp path unavailable}"
          : "${GITHUB_RUN_ID:?run id unavailable}"
          : "${GITHUB_RUN_ATTEMPT:?run attempt unavailable}"
          PREFLIGHT_DIR="$RUNNER_TEMP/gh-lab-05-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          # Inspect exported variable NAMES only; never expand values or print names.
          sensitive_name_present=0
          while IFS= read -r name; do
            case "${name^^}" in
              *TOKEN*|*SECRET*|*PASSWORD*|*PRIVATE_KEY*|*CREDENTIAL*|*DATABASE_URL*|*SUPABASE*|*SERVICE_ROLE*|*PRODUCTION*|*API_KEY*|*ACCESS_KEY*|*AUTHORIZATION*) sensitive_name_present=1 ;;
            esac
          done < <(compgen -e)

          # Start the probe with a clean environment and explicit non-secret identity metadata.
          exec /usr/bin/env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            LC_ALL=C \
            BASH_ENV=/dev/null \
            ENV=/dev/null \
            PREFLIGHT_DIR="$PREFLIGHT_DIR" \
            PREFLIGHT_SENSITIVE_NAME_PRESENT="$sensitive_name_present" \
            GH_REPOSITORY="${GITHUB_REPOSITORY-}" \
            GH_REF="${GITHUB_REF-}" \
            GH_EVENT="${GITHUB_EVENT_NAME-}" \
            GH_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT-}" \
            GH_RUN_ID="${GITHUB_RUN_ID-}" \
            RUNNER_OS_VALUE="${RUNNER_OS-}" \
            RUNNER_ARCH_VALUE="${RUNNER_ARCH-}" \
            RUNNER_ENVIRONMENT_VALUE="${RUNNER_ENVIRONMENT-}" \
            RUNNER_TEMP_VALUE="${RUNNER_TEMP-}" \
            IMAGE_OS_VALUE="${ImageOS-}" \
            IMAGE_VERSION_VALUE="${ImageVersion-}" \
            /usr/bin/python3 - <<'PY'
          import json, os, pathlib, re, shutil, subprocess, signal

          GIB = 1024 ** 3
          EXPECTED_REPOSITORY = "luit77yak-dev/neroxa-pg17-security-lab"
          EXPECTED_REF = "refs/heads/main"
          EXPECTED_EVENT = "workflow_dispatch"
          MIN_CPUS = 2
          MIN_MEMORY = 1 * GIB
          MIN_DISK_BEFORE = 4 * GIB
          MIN_DISK_AFTER_PROBE = 3 * GIB

          results = {}

          def record(name, ok, detail="", blocked=False):
              results[name] = bool(ok)
              status = "PASS" if ok else ("BLOCKED" if blocked else "FAIL")
              print(f"{name}={status}" + (f" ({detail})" if detail else ""))

          def allowlisted_environment(source):
              allowed = {
                  "PATH", "LC_ALL", "BASH_ENV", "ENV", "PREFLIGHT_DIR",
                  "GH_REPOSITORY", "GH_REF", "GH_EVENT", "GH_RUN_ID", "GH_RUN_ATTEMPT",
                  "RUNNER_OS_VALUE", "RUNNER_ARCH_VALUE", "RUNNER_ENVIRONMENT_VALUE",
                  "RUNNER_TEMP_VALUE", "IMAGE_OS_VALUE", "IMAGE_VERSION_VALUE",
                  "PREFLIGHT_SENSITIVE_NAME_PRESENT",
              }
              return {key: value for key, value in source.items() if key in allowed}

          def cgroup_ancestors():
              base = pathlib.Path("/sys/fs/cgroup")
              try:
                  line = next(line for line in pathlib.Path("/proc/self/cgroup").read_text().splitlines()
                              if line.startswith("0::"))
              except (OSError, StopIteration):
                  return []
              leaf = base / line[3:].lstrip("/")
              if not leaf.is_dir():
                  return []
              paths = []
              current = leaf
              while current == base or base in current.parents:
                  paths.append(current)
                  if current == base:
                      break
                  current = current.parent
              return paths

          def parse_cpu_quota():
              known = False
              quotas = []
              for root in cgroup_ancestors():
                  try:
                      quota, period = (root / "cpu.max").read_text().split()
                      known = True
                      if quota != "max":
                          quotas.append(int(quota) // int(period))
                  except (OSError, ValueError, ZeroDivisionError):
                      continue
              return known, min(quotas) if quotas else None

          def parse_memory_available():
              try:
                  lines = pathlib.Path("/proc/meminfo").read_text().splitlines()
                  host = next(int(line.split()[1]) * 1024 for line in lines if line.startswith("MemAvailable:"))
              except (OSError, StopIteration, ValueError):
                  return None
              remaining = []
              known = False
              for root in cgroup_ancestors():
                  try:
                      limit_text = (root / "memory.max").read_text().strip()
                      current = int((root / "memory.current").read_text().strip())
                      known = True
                      if limit_text != "max":
                          remaining.append(max(0, int(limit_text) - current))
                  except (OSError, ValueError):
                      continue
              if not known:
                  return None
              return min([host] + remaining)

          def disk_free(path):
              return shutil.disk_usage(path).free

          def main():
              clean_env = allowlisted_environment(os.environ)
              os.environ.clear()
              os.environ.update(clean_env)
              # Check only names; values are neither loaded nor emitted.
              record("credential_like_environment_names_absent", os.environ.get("PREFLIGHT_SENSITIVE_NAME_PRESENT") == "0",
                     "names redacted; no variable values inspected")
              record("repository_ref_event", (os.environ.get("GH_REPOSITORY"), os.environ.get("GH_REF"), os.environ.get("GH_EVENT")) ==
                     (EXPECTED_REPOSITORY, EXPECTED_REF, EXPECTED_EVENT))
              record("single_attempt_context", os.environ.get("GH_RUN_ATTEMPT") == "1")
              os_release = pathlib.Path("/etc/os-release").read_text()
              os_version = next((line.split("=", 1)[1].strip().strip('"') for line in os_release.splitlines()
                                 if line.startswith("VERSION_ID=")), "unknown")
              image_os = os.environ.get("IMAGE_OS_VALUE", "")
              image_version = os.environ.get("IMAGE_VERSION_VALUE", "")
              runner_ok = ((os.environ.get("RUNNER_OS_VALUE"), os.environ.get("RUNNER_ARCH_VALUE"),
                            os.environ.get("RUNNER_ENVIRONMENT_VALUE"), os_version, image_os) ==
                           ("Linux", "X64", "github-hosted", "24.04", "ubuntu24") and bool(image_version))
              record("runner_identity", runner_ok,
                     f"image={image_os or 'unknown'}/{image_version or 'unknown'}")
              if not all(results[name] for name in ("credential_like_environment_names_absent", "repository_ref_event", "single_attempt_context", "runner_identity")):
                  print("PREFLIGHT=FAIL (identity or environment gate; no privileged probe started)")
                  raise SystemExit(20)

              affinity = len(os.sched_getaffinity(0)) if hasattr(os, "sched_getaffinity") else os.cpu_count() or 0
              quota_known, quota = parse_cpu_quota()
              effective_cpus = min(affinity, quota) if quota is not None else affinity
              record("cpu_floor", quota_known and effective_cpus >= MIN_CPUS,
                     f"effective={effective_cpus}; quota_known={quota_known}; minimum={MIN_CPUS}", blocked=not quota_known)

              memory = parse_memory_available()
              record("memory_floor", memory is not None and memory >= MIN_MEMORY,
                     f"available_bytes={memory if memory is not None else 'unknown'}; minimum={MIN_MEMORY}", blocked=memory is None)

              preflight_dir = pathlib.Path(os.environ["PREFLIGHT_DIR"]).resolve(strict=False)
              runner_temp = pathlib.Path(os.environ["RUNNER_TEMP_VALUE"]).resolve(strict=True)
              # The context-derived path is passed by workflow env. Require a direct child of RUNNER_TEMP.
              expected_name = f"gh-lab-05-{os.environ.get('GH_RUN_ID', '')}-{os.environ.get('GH_RUN_ATTEMPT', '')}"
              path_ok = preflight_dir.parent == runner_temp and preflight_dir.name == expected_name and bool(re.fullmatch(r"gh-lab-05-[0-9]+-[0-9]+", expected_name))
              record("temporary_path_scope", path_ok, blocked=not path_ok)
              if not results["temporary_path_scope"]:
                  print("PREFLIGHT=BLOCKED (temporary path scope is not verified)")
                  raise SystemExit(20)
              root_free = disk_free("/")
              temp_free = disk_free(runner_temp)
              record("disk_floor_before", min(root_free, temp_free) >= MIN_DISK_BEFORE,
                     f"root={root_free}; runner_temp={temp_free}; minimum={MIN_DISK_BEFORE}")

              if not all(results[name] for name in ("cpu_floor", "memory_floor", "disk_floor_before", "temporary_path_scope")):
                  print("PREFLIGHT=BLOCKED_OR_FAIL (resource/path gate; no directory or privileged probe created)")
                  raise SystemExit(20)

              # Resource and path gates pass before any temporary directory is created.
              preflight_dir.mkdir(mode=0o700, parents=False, exist_ok=False)

              required = ("/usr/bin/sudo", "/usr/bin/unshare", "/usr/bin/setpriv", "/usr/sbin/ip", "/usr/bin/install")
              missing = [path for path in required if not pathlib.Path(path).is_file()]
              record("probe_tools_present", not missing, "required tools missing" if missing else "", blocked=bool(missing))

              if not missing and results["disk_floor_before"]:
                  host_net_inode = os.stat("/proc/self/ns/net").st_ino
                  socket_dir = preflight_dir / "private-socket"
                  create = subprocess.run(["/usr/bin/sudo", "-n", "/usr/bin/install", "-d", "-o", "65534", "-g", "65534", "-m", "0700", "--", str(socket_dir)],
                                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
                  record("private_directory_created", create.returncode == 0,
                         blocked=create.returncode != 0)
                  probe = r'''import os, pathlib, socket, stat, subprocess, sys
          directory = pathlib.Path(sys.argv[1])
          host_inode = int(sys.argv[2])
          uid, gid = os.getuid(), os.getgid()
          if uid != 65534 or gid != 65534 or os.getgroups() or uid == 0:
              raise SystemExit(31)
          status = pathlib.Path("/proc/self/status").read_text().splitlines()
          fields = {line.split(":", 1)[0]: line.split(":", 1)[1].strip() for line in status if ":" in line}
          if int(fields.get("CapEff", "-1"), 16) != 0 or int(fields.get("CapPrm", "-1"), 16) != 0 or fields.get("NoNewPrivs") != "1":
              raise SystemExit(32)
          if os.stat("/proc/self/ns/net").st_ino == host_inode:
              raise SystemExit(33)
          links = json.loads(subprocess.check_output(["/usr/sbin/ip", "-j", "link"], text=True))
          if [link.get("ifname") for link in links] != ["lo"]:
              raise SystemExit(34)
          if subprocess.check_output(["/usr/sbin/ip", "-4", "route", "show"], text=True).strip():
              raise SystemExit(35)
          if subprocess.check_output(["/usr/sbin/ip", "-6", "route", "show"], text=True).strip():
              raise SystemExit(36)
          path = directory / "probe.sock"
          old = os.umask(0o177)
          try:
              sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              sock.bind(str(path))
              mode = stat.S_IMODE(path.stat().st_mode)
              sock.close()
          finally:
              os.umask(old)
          if mode != 0o600:
              raise SystemExit(37)
          path.unlink(missing_ok=True)
          print("NETWORK_NAMESPACE=PASS")
          print("LOW_PRIVILEGE_IDENTITY=PASS")
          print("PRIVATE_UNIX_SOCKET=PASS")
          '''
                  command = ["/usr/bin/sudo", "-n", "/usr/bin/unshare", "--net", "--fork", "--",
                             "/usr/bin/setpriv", "--reuid=65534", "--regid=65534", "--clear-groups",
                             "--bounding-set=-all", "--inh-caps=-all", "--ambient-caps=-all", "--no-new-privs",
                             "/usr/bin/python3", "-c", "import json;\n" + probe, str(socket_dir), str(host_net_inode)]
                  def classify_probe_stderr(stderr_text):
                      # Match only known diagnostic signatures; never emit raw stderr.
                      diagnostic = stderr_text.lower()
                      denied = ("operation not permitted", "permission denied", "not permitted", "eperm")
                      if "sudo:" in diagnostic:
                          return "SUDO_INVOCATION_FAILURE"
                      if "unshare:" in diagnostic:
                          return "NAMESPACE_PERMISSION_DENIED" if any(token in diagnostic for token in denied) else "UNSHARE_INVOCATION_FAILURE"
                      if "setpriv:" in diagnostic:
                          return "SETPRIV_PERMISSION_DENIED" if any(token in diagnostic for token in denied) else "SETPRIV_INVOCATION_FAILURE"
                      if "traceback (most recent call last)" in diagnostic or any(token in diagnostic for token in ("syntaxerror", "nameerror", "importerror", "modulenotfounderror")):
                          return "PROBE_INTERNAL_FAILURE"
                      if any(token in diagnostic for token in denied):
                          return "PRIVILEGE_RESTRICTION_UNATTRIBUTED"
                      return "CHILD_FAILURE_UNCLASSIFIED"

                  try:
                      child = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                                               start_new_session=True, close_fds=True)
                  except OSError as exc:
                      print(f"PROBE_DIAGNOSTIC=PROCESS_LAUNCH_OSERROR; type={type(exc).__name__}")
                      record("network_isolation_probe", False, "process launch failed; details redacted", blocked=True)
                  else:
                      timed_out = False
                      try:
                          output, diagnostic_stderr = child.communicate(timeout=90)
                      except subprocess.TimeoutExpired:
                          os.killpg(child.pid, signal.SIGKILL)
                          output, diagnostic_stderr = child.communicate()
                          timed_out = True
                          record("network_probe_timeout", False, "process group terminated; details redacted")
                      result_returncode = child.returncode
                      # Only fixed status tokens from the child are forwarded.
                      safe_lines = {"NETWORK_NAMESPACE=PASS", "LOW_PRIVILEGE_IDENTITY=PASS", "PRIVATE_UNIX_SOCKET=PASS"}
                      child_tokens = set(output.splitlines()) & safe_lines
                      for token in sorted(child_tokens):
                          print(token)
                      if timed_out:
                          print(f"PROBE_DIAGNOSTIC=PROCESS_TIMEOUT; exit={result_returncode}")
                          record("network_namespace_no_routes", False, "probe timed out", blocked=True)
                          record("nonprivileged_process", False, "probe timed out", blocked=True)
                          record("private_unix_socket", False, "probe timed out", blocked=True)
                      elif result_returncode == 0:
                          record("network_namespace_no_routes", "NETWORK_NAMESPACE=PASS" in child_tokens)
                          record("nonprivileged_process", "LOW_PRIVILEGE_IDENTITY=PASS" in child_tokens)
                          record("private_unix_socket", "PRIVATE_UNIX_SOCKET=PASS" in child_tokens)
                          if len(child_tokens) != 3:
                              print("PROBE_DIAGNOSTIC=EXPECTED_STATUS_MISSING; exit=0")
                      elif result_returncode in (33, 34, 35, 36):
                          record("network_namespace_no_routes", False, "measured namespace/interface/route violation")
                          record("nonprivileged_process", True, "UID and capability checks passed")
                          record("private_unix_socket", False, "socket probe not completed", blocked=True)
                      elif result_returncode == 37:
                          record("network_namespace_no_routes", True, "namespace/interface/route checks passed")
                          record("nonprivileged_process", True, "UID and capability checks passed")
                          record("private_unix_socket", False, "socket mode violation")
                      elif result_returncode == 31:
                          record("network_namespace_no_routes", False, "probe stopped before network checks", blocked=True)
                          record("nonprivileged_process", False, "UID/GID/groups violation")
                          record("private_unix_socket", False, "probe not completed", blocked=True)
                      elif result_returncode == 32:
                          record("network_namespace_no_routes", False, "probe stopped before network checks", blocked=True)
                          record("nonprivileged_process", False, "capability or no_new_privs violation")
                          record("private_unix_socket", False, "probe not completed", blocked=True)
                      else:
                          print(f"PROBE_DIAGNOSTIC={classify_probe_stderr(diagnostic_stderr)}; exit={result_returncode}")
                          record("network_namespace_no_routes", False, "namespace probe failed; detail class recorded", blocked=True)
                          record("nonprivileged_process", False, "namespace probe failed; detail class recorded", blocked=True)
                          record("private_unix_socket", False, "socket probe not completed", blocked=True)
              else:
                  record("network_namespace_no_routes", False, "missing prerequisite", blocked=True)
                  record("nonprivileged_process", False, "missing prerequisite", blocked=True)
                  record("private_unix_socket", False, "missing prerequisite", blocked=True)

              root_after = disk_free("/")
              temp_after = disk_free(runner_temp)
              record("disk_floor_after_probe", min(root_after, temp_after) >= MIN_DISK_AFTER_PROBE,
                     f"root={root_after}; runner_temp={temp_after}; minimum={MIN_DISK_AFTER_PROBE}; not post-initialization")
              print("POSTGRESQL_INITIALIZATION_DISK=NOT_TESTED")
              print("SQL_TESTS=NOT_RUN")
              print("LAB_READINESS=BLOCKED_UNTIL_SEPARATE_AUTHORIZATION_AND_POST_INIT_CHECK")
              if not all(results.values()):
                  raise SystemExit(20)

          try:
              main()
          except Exception as exc:
              # Fail closed without exception strings, which may contain environment or filesystem data.
              print(f"PREFLIGHT=BLOCKED ({type(exc).__name__}; details redacted)")
              raise SystemExit(21)
          PY
      - name: Cleanup and residue audit
        if: ${{ always() }}
        run: |
          set -euo pipefail
          set +x
          : "${RUNNER_TEMP:?runner temp path unavailable}"
          : "${GITHUB_RUN_ID:?run id unavailable}"
          : "${GITHUB_RUN_ATTEMPT:?run attempt unavailable}"
          PREFLIGHT_DIR="$RUNNER_TEMP/gh-lab-05-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export PREFLIGHT_DIR
          /usr/bin/python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess, sys
          temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          target = pathlib.Path(os.environ["PREFLIGHT_DIR"]).resolve(strict=False)
          if target.parent != temp or not re.fullmatch(r"gh-lab-05-[0-9]+-[0-9]+", target.name):
              print("CLEANUP=BLOCKED (unsafe path; no deletion attempted)")
              raise SystemExit(40)
          if target.exists():
              removed = subprocess.run(["/usr/bin/sudo", "-n", "/usr/bin/rm", "-rf", "--", str(target)],
                                       stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
              if removed.returncode != 0:
                  print("CLEANUP=FAIL (removal failed; details redacted)")
                  raise SystemExit(41)
          if target.exists():
              print("CLEANUP=FAIL (residue remains)")
              raise SystemExit(42)
          print("CLEANUP=PASS (candidate temporary directory absent)")
          print("VM_TEARDOWN_CLEANUP=PLATFORM_DEPENDENT; abrupt cancellation is not covered")
          PY
