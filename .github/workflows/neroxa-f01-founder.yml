name: NEROXA F01 - Founder-approved disposable Prova 1
on:
  workflow_dispatch:
    inputs:
      founder_approval:
        description: 'Founder explicitly admits ONE native F01 run'
        type: choice
        required: true
        options: [NOT_APPROVED, F01_ONE_DISPOSABLE_RUN]
        default: NOT_APPROVED
      expected_lab_sha:
        description: 'Exact frozen commit SHA of this lab runner workflow'
        type: string
        required: true
        default: '0000000000000000000000000000000000000000'
      expected_master_sha:
        description: 'Exact reviewed Master F01 candidate commit SHA'
        type: string
        required: true
        default: '0000000000000000000000000000000000000000'
permissions:
  contents: read
  actions: read
concurrency:
  group: neroxa-f01-prova1-founder-single-use
  cancel-in-progress: false
jobs:
  native-isolation:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'luit77yak-dev' && github.triggering_actor == 'luit77yak-dev' && inputs.founder_approval == 'F01_ONE_DISPOSABLE_RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MASTER_SHA: '0e98cda5dce5e84f7019e6d97d69b1aa1ee6f023'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      AB_PROJECT: neroxa-02a3-${{ github.run_id }}-buyer
      AB_NETWORK: neroxa-02a5-${{ github.run_id }}-buyer
      MISSION_PROFILE: master
      MISSION_FOCUS: f01-prova1
      MISSION_ACTORS: all
      MISSION02A4_SQL: audits/02a4/availability-instance-scope.candidate.sql,audits/02a4/addon-explicit-membership.candidate.sql,audits/02a4/delivery-live-session.candidate.sql
      MISSION02A4_AVAILABILITY: 'false'
      MISSION_F01_FOCUS: proof1-focal
      MISSION02A4_STORAGE: 'false'
      MISSION_MUTATION_PROBE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 'luit77yak-dev/neroxa-master'
          ref: '0e98cda5dce5e84f7019e6d97d69b1aa1ee6f023'
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 'luit77yak-dev/neroxa-pg17-security-lab'
          ref: ${{ github.sha }}
          path: lab-gate
          persist-credentials: false
      - name: Validate restricted broker source before any installation
        run: |
          set -euo pipefail
          python3 -m py_compile lab-gate/tools/f01_docker_broker.py
          python3 -m unittest discover -s lab-gate/tools -p 'test_f01_docker_broker.py' -v
          test "$(git -C lab-gate rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'F01_DOCKER_BROKER_STATIC=PASS; source pinned to lab SHA'
      - name: Founder approval, exact SHAs and consumed-run gate (before services)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LAB_SHA: ${{ inputs.expected_lab_sha }}
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'luit77yak-dev/neroxa-pg17-security-lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = 'luit77yak-dev'
          test "$GITHUB_TRIGGERING_ACTOR" = 'luit77yak-dev'
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_LAB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_LAB_SHA" != '0000000000000000000000000000000000000000'
          test "$EXPECTED_LAB_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_MASTER_SHA" = "$MASTER_SHA"
          test "$(git rev-parse HEAD)" = "$MASTER_SHA"
          prior_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/neroxa-f01-founder.yml/runs?per_page=100" --jq .total_count)
          test "$prior_count" = 1
          echo 'NEROXA_F01_FOUNDER_GATE=PASS; github-hosted disposable run only; not commercial authorization'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Public standard eligibility and real capacity before pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = false
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo 'PUBLIC_STANDARD_RUNNER=true; billing basis docs.github.com/en/billing/concepts/product-billing/github-actions; no larger runner/cache/artifact uploads'
          python3 tools/mission-02a3/preflight.py
      - name: Locked app dependencies and pinned CLI; no commercial dotenv
        run: |
          find . -name '.env*' -not -path './.git/*' -not -path './node_modules/*' -type f -delete
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund supabase@2.120.0
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
          python3 tools/f01/generate.py
      - name: Unlinked native six-service stack, loopback binds
        run: |
          export AB_WORKDIR="$RUNNER_TEMP/02a5-buyer-$GITHUB_RUN_ID"
          echo "AB_WORKDIR=$AB_WORKDIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$AB_WORKDIR"
          supabase init --workdir "$AB_WORKDIR"
          python3 tools/ab-auth/configure.py
          test ! -f "$AB_WORKDIR/supabase/.temp/project-ref"
          test ! -d "$AB_WORKDIR/supabase/migrations"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$AB_NETWORK"
          python3 tools/ab-auth/docker_loopback.py > "$AB_WORKDIR/relay.private.log" 2>&1 &
          echo $! > "$AB_WORKDIR/relay.pid"
          for attempt in $(seq 1 30); do test -S "$AB_WORKDIR/docker-loopback.sock" && break; sleep 1; done
          export DOCKER_HOST="unix://$AB_WORKDIR/docker-loopback.sock"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          # The upstream PostgreSQL tag was republished. Reuse the ORIGINAL image,
          # not a newly admitted image: immutable manifest -> unchanged frozen config ID.
          pg='supabase/postgres@sha256:f2a84af37797675f0b27e27ea1fad2ebcd913ebf7ad60be05d7df0bcbd29e4b5'
          docker --host=unix:///var/run/docker.sock pull --platform linux/amd64 "$pg"
          test "$(docker --host=unix:///var/run/docker.sock image inspect "$pg" --format '{{.Id}}')" = "$(python3 -c 'import json; print(json.load(open("audits/02a5/EXPECTED-IMAGES.json"))["supabase/postgres:17.11.0.004"])')"
          docker --host=unix:///var/run/docker.sock tag "$pg" supabase/postgres:17.11.0.004
          if ! supabase start --workdir "$AB_WORKDIR" --network-id "$AB_NETWORK" --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$AB_WORKDIR/start.private.log" 2>&1; then
            python3 tools/ab-auth/start_failure.py
            exit 1
          fi
          supabase status --workdir "$AB_WORKDIR" -o env > "$AB_WORKDIR/status.private.env"
          chmod 600 "$AB_WORKDIR/status.private.env"
          python3 - <<'PY'
          import json,subprocess,os
          expected=json.load(open('audits/02a5/EXPECTED-IMAGES.json'));seen={}
          for line in subprocess.check_output(['docker','ps','--format','{{json .}}'],text=True).splitlines():
            c=json.loads(line)
            if c['Names'].endswith('_'+os.environ['AB_PROJECT']):seen[c['Image']]=subprocess.check_output(['docker','inspect',c['Names'],'--format','{{.Image}}'],text=True).strip()
          print('IMAGE_IDENTITY_COMPARISON='+json.dumps({'expected':expected,'observed':seen},sort_keys=True))
          assert seen==expected, 'BLOCKED: image identity drift'
          print('IMAGE_IDENTITIES='+json.dumps(seen))
          PY
      - name: Real Auth and buyer recut with test UID egress restriction
        run: |
          set -euo pipefail
          sudo useradd --create-home neroxa_test
          if id -nG neroxa_test | tr ' ' '\n' | grep -qx docker; then echo 'F01_TEST_DOCKER_GROUP=FAIL'; exit 1; fi
          echo 'F01_TEST_DOCKER_GROUP=ABSENT'
          sudo chown -R neroxa_test:neroxa_test "$AB_WORKDIR"
          # The Supabase CLI's broad Docker relay is owned by the runner, NEVER the test UID.
          sudo chown "$(id -u):$(id -g)" "$AB_WORKDIR/docker-loopback.sock"
          sudo chmod 600 "$AB_WORKDIR/docker-loopback.sock"
          sudo -u neroxa_test env AB_WORKDIR="$AB_WORKDIR" python3 - <<'PY'
          import os,socket
          for name in ('/var/run/docker.sock',os.environ['AB_WORKDIR']+'/docker-loopback.sock'):
              s=socket.socket(socket.AF_UNIX)
              try:
                  s.connect(name)
              except PermissionError:
                  pass
              else:
                  raise SystemExit('F01_DOCKER_SOCKET_ISOLATION=FAIL')
              finally:
                  s.close()
          print('F01_DOCKER_SOCKET_ISOLATION=PASS')
          PY
          BROKER_DIR="$RUNNER_TEMP/f01-broker-$GITHUB_RUN_ID"
          echo "BROKER_DIR=$BROKER_DIR" >> "$GITHUB_ENV"
          mkdir -m 711 "$BROKER_DIR"
          ancestor="$BROKER_DIR"
          while [ "$ancestor" != / ]; do
            sudo setfacl -m u:neroxa_test:--x "$ancestor"
            ancestor=$(dirname "$ancestor")
          done
          cat > "$BROKER_DIR/docker" <<EOF
          #!/bin/sh
          exec /usr/bin/python3 "$GITHUB_WORKSPACE/lab-gate/tools/f01_docker_broker.py" client --socket "\$F01_BROKER_SOCKET" "\$@"
          EOF
          chmod 755 "$BROKER_DIR/docker"
          python3 lab-gate/tools/f01_docker_broker.py serve --socket "$BROKER_DIR/broker.sock" --project "$AB_PROJECT" --test-uid "$(id -u neroxa_test)" > "$BROKER_DIR/broker.log" 2>&1 &
          echo $! > "$BROKER_DIR/broker.pid"
          for attempt in $(seq 1 30); do test -S "$BROKER_DIR/broker.sock" && break; sleep 1; done
          test -S "$BROKER_DIR/broker.sock"
          sudo chgrp neroxa_test "$BROKER_DIR/broker.sock"
          sudo chmod 660 "$BROKER_DIR/broker.sock"
          # Dedicated UID needs traversal/read of the audited workspace, not runner secrets.
          ancestor="$GITHUB_WORKSPACE"
          while [ "$ancestor" != / ]; do
            sudo setfacl -m u:neroxa_test:--x "$ancestor"
            ancestor=$(dirname "$ancestor")
          done
          sudo setfacl -R -m u:neroxa_test:rX "$GITHUB_WORKSPACE"
          sudo -u neroxa_test test -r tools/mission-02a3/f01-generated.private.mjs
          echo 'TEST_UID_WORKSPACE_READ=PASS'
          sudo -u neroxa_test env -i PATH="$BROKER_DIR:$PATH" F01_BROKER_SOCKET="$BROKER_DIR/broker.sock" "$BROKER_DIR/docker" ps --format '{{json .}}' > /dev/null
          echo 'F01_RESTRICTED_DOCKER_BROKER=PASS'
          bash tools/mission-02a5/network.sh lock
          trap 'bash tools/mission-02a5/network.sh unlock' EXIT
          uid="$(id -u neroxa_test)"
          nid="$(docker --host=unix:///var/run/docker.sock network inspect "$AB_NETWORK" --format '{{.Id}}')"
          bridge="br-${nid:0:12}"
          sudo iptables -C OUTPUT -m owner --uid-owner "$uid" -j NEROXA02A5
          sudo iptables -C NEROXA02A5 -j REJECT
          sudo ip6tables -C OUTPUT -m owner --uid-owner "$uid" -j NEROXA02A5
          sudo ip6tables -C NEROXA02A5 -j REJECT
          sudo iptables -C DOCKER-USER -i "$bridge" ! -o "$bridge" -j REJECT
          before="$(sudo iptables -L NEROXA02A5 -v -x -n | awk '$3=="REJECT" {print $1}')"
          [[ "$before" =~ ^[0-9]+$ ]]
          sudo -u neroxa_test env -i python3 - <<'PY'
          import socket
          s=socket.socket()
          s.settimeout(2)
          try:
              result=s.connect_ex(('198.51.100.1',443))
              assert result != 0, 'F01_EGRESS_PROBE_UNEXPECTED_CONNECTION'
          finally:
              s.close()
          PY
          after="$(sudo iptables -L NEROXA02A5 -v -x -n | awk '$3=="REJECT" {print $1}')"
          [[ "$after" =~ ^[0-9]+$ ]]
          test "$after" -gt "$before"
          echo 'F01_EGRESS_FIREWALL_COUNTER=PASS; packet reached reject rule'
          sudo -u neroxa_test env -i PATH="$BROKER_DIR:$PATH" F01_BROKER_SOCKET="$BROKER_DIR/broker.sock" HOME=/home/neroxa_test AB_WORKDIR="$AB_WORKDIR" AB_PROJECT="$AB_PROJECT" MISSION_PROFILE=master MISSION_FOCUS=f01-prova1 MISSION_ACTORS=all MISSION02A4_SQL="$MISSION02A4_SQL" MISSION02A4_AVAILABILITY=false MISSION_F01_FOCUS=proof1-focal MISSION02A4_STORAGE=false MISSION_MUTATION_PROBE=false AB_NETWORK="$AB_NETWORK" MISSION_SOURCE_SHA="$MASTER_SHA" MISSION_RUN_ID="$GITHUB_RUN_ID" DOCKER_HOST=unix:///var/run/docker.sock node --experimental-strip-types tools/mission-02a3/f01-generated.private.mjs | tee "$RUNNER_TEMP/f01-prova1.log"
      - name: Verify six F01 Prova 1 receipts (fail closed)
        run: python3 tools/f01/proof1_result.py "$RUNNER_TEMP/f01-prova1.log"
      - name: Cleanup only this disposable project
        if: always()
        run: |
          set -uo pipefail
          cleanup_failed=0
          if ! bash tools/mission-02a5/network.sh unlock; then echo 'CLEANUP_ERROR=egress unlock'; cleanup_failed=1; fi
          if [ -n "${AB_WORKDIR:-}" ] && sudo test -d "$AB_WORKDIR"; then
            sudo chown -R "$(id -u):$(id -g)" "$AB_WORKDIR" || { echo 'CLEANUP_ERROR=workdir ownership'; cleanup_failed=1; }
          fi
          export DOCKER_HOST=unix:///var/run/docker.sock
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/supabase/config.toml" ]; then
            supabase stop --workdir "$AB_WORKDIR" --no-backup || { echo 'CLEANUP_ERROR=supabase stop'; cleanup_failed=1; }
          fi
          if [ -n "${AB_WORKDIR:-}" ] && [ -f "$AB_WORKDIR/relay.pid" ]; then
            relay_pid=$(cat "$AB_WORKDIR/relay.pid")
            kill "$relay_pid" 2>/dev/null || true
            for attempt in $(seq 1 10); do kill -0 "$relay_pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$relay_pid" 2>/dev/null; then echo 'CLEANUP_ERROR=relay still active'; cleanup_failed=1; fi
          fi
          if docker network inspect "$AB_NETWORK" >/dev/null 2>&1; then
            docker network rm "$AB_NETWORK" || { echo 'CLEANUP_ERROR=network removal'; cleanup_failed=1; }
          fi
          remaining=$(docker ps -aq --filter "label=com.supabase.cli.project=$AB_PROJECT" 2>/dev/null) || { echo 'CLEANUP_ERROR=container inventory'; cleanup_failed=1; remaining=UNKNOWN; }
          if [ "$remaining" = UNKNOWN ] || [ -n "$remaining" ]; then echo 'CLEANUP_ERROR=containers remain or inventory unknown'; cleanup_failed=1; fi
          if [ -n "${BROKER_DIR:-}" ] && [ "$BROKER_DIR" = "$RUNNER_TEMP/f01-broker-$GITHUB_RUN_ID" ]; then
            if [ -f "$BROKER_DIR/broker.pid" ]; then
              broker_pid=$(cat "$BROKER_DIR/broker.pid")
              kill "$broker_pid" 2>/dev/null || true
              for attempt in $(seq 1 10); do kill -0 "$broker_pid" 2>/dev/null || break; sleep 1; done
              if kill -0 "$broker_pid" 2>/dev/null; then echo 'CLEANUP_ERROR=broker still active'; cleanup_failed=1; fi
            fi
            rm -rf -- "$BROKER_DIR" || { echo 'CLEANUP_ERROR=broker dir'; cleanup_failed=1; }
            if [ -e "$BROKER_DIR" ]; then echo 'CLEANUP_ERROR=broker dir remains'; cleanup_failed=1; fi
          fi
          if [ -n "${AB_WORKDIR:-}" ] && [ "$AB_WORKDIR" = "$RUNNER_TEMP/02a5-buyer-$GITHUB_RUN_ID" ]; then
            rm -rf -- "$AB_WORKDIR" || { echo 'CLEANUP_ERROR=workdir removal'; cleanup_failed=1; }
            if [ -e "$AB_WORKDIR" ]; then echo 'CLEANUP_ERROR=workdir remains'; cleanup_failed=1; fi
          fi
          if [ "$cleanup_failed" -ne 0 ]; then echo 'CLEANUP=FAIL'; exit 1; fi
          echo 'CLEANUP=PASS; project containers, network, broker, relay and private workdir removed'
