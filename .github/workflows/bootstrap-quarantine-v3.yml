name: NEROXA isolated bootstrap V3 single candidate
on:
  push:
    branches: [lab/bootstrap-quarantine-v3-20261103]
    paths:
      - .github/workflows/bootstrap-quarantine-v3.yml
      - quarantine/**
permissions:
  contents: read
concurrency:
  group: neroxa-bootstrap-v3-once
  cancel-in-progress: false
jobs:
  disposable-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luit77yak-dev/neroxa-master
          ref: b8a2087ad96dde4f90c04a7c10c31281d663e9f8
          path: master-src
          persist-credentials: false
      - name: Identity and bounded resource preflight (no pulls)
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "luit77yak-dev/neroxa-pg17-security-lab"
          test "$GITHUB_REF" = "refs/heads/lab/bootstrap-quarantine-v3-20261103"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(git -C master-src rev-parse HEAD)" = "b8a2087ad96dde4f90c04a7c10c31281d663e9f8"
          python3 master-src/tools/mission-02a3/preflight.py
      - name: Offline derivation and source integrity; 33 units NOT applied
        run: |
          set -euo pipefail
          umask 077
          python3 quarantine/derive_and_verify.py master-src "$RUNNER_TEMP/bootstrap-v3-$GITHUB_RUN_ID"
          test ! -e master-src/supabase/.temp/project-ref
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'
      - name: Install pinned local CLI; no app scripts, no commercial dotenv
        run: |
          set -euo pipefail
          find master-src -type f -name '.env*' -not -path '*/node_modules/*' -delete
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund supabase@2.120.0 >/dev/null
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Start isolated native PG17 with pinned images
        working-directory: master-src
        run: |
          set -euo pipefail
          export AB_PROJECT="neroxa-bq-$GITHUB_RUN_ID"
          export AB_NETWORK="neroxa-bq-$GITHUB_RUN_ID-net"
          export AB_WORKDIR="$RUNNER_TEMP/neroxa-bq-$GITHUB_RUN_ID"
          printf 'AB_PROJECT=%s\nAB_NETWORK=%s\nAB_WORKDIR=%s\n' "$AB_PROJECT" "$AB_NETWORK" "$AB_WORKDIR" >> "$GITHUB_ENV"
          mkdir -m 700 "$AB_WORKDIR"
          supabase init --workdir "$AB_WORKDIR" >/dev/null
          python3 tools/ab-auth/configure.py
          test ! -f "$AB_WORKDIR/supabase/.temp/project-ref"
          test ! -d "$AB_WORKDIR/supabase/migrations"
          docker network create --driver bridge --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$AB_NETWORK" >/dev/null
          python3 tools/ab-auth/docker_loopback.py > "$AB_WORKDIR/relay.private.log" 2>&1 &
          echo $! > "$AB_WORKDIR/relay.pid"
          for attempt in $(seq 1 30); do test -S "$AB_WORKDIR/docker-loopback.sock" && break; sleep 1; done
          test -S "$AB_WORKDIR/docker-loopback.sock"
          export DOCKER_HOST="unix://$AB_WORKDIR/docker-loopback.sock"
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          pg='supabase/postgres@sha256:f2a84af37797675f0b27e27ea1fad2ebcd913ebf7ad60be05d7df0bcbd29e4b5'
          docker --host=unix:///var/run/docker.sock pull --platform linux/amd64 "$pg" >/dev/null
          expected=$(python3 -c 'import json; print(json.load(open("audits/02a5/EXPECTED-IMAGES.json"))["supabase/postgres:17.11.0.004"])')
          observed=$(docker --host=unix:///var/run/docker.sock image inspect "$pg" --format '{{.Id}}')
          test "$observed" = "$expected"
          docker --host=unix:///var/run/docker.sock tag "$pg" supabase/postgres:17.11.0.004
          if ! supabase start --workdir "$AB_WORKDIR" --network-id "$AB_NETWORK" --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$AB_WORKDIR/start.private.log" 2>&1; then
            python3 tools/ab-auth/start_failure.py
            exit 1
          fi
          echo 'SIX_SERVICE_STACK_STARTED_WITHOUT_HOSTED_LINK=PASS'
      - name: Native SQL and effective ACL negatives (disposable only)
        working-directory: master-src
        run: |
          set -euo pipefail
          sudo useradd --create-home neroxa_test
          bash tools/mission-02a5/network.sh lock
          trap 'bash tools/mission-02a5/network.sh unlock' EXIT
          db="supabase_db_$AB_PROJECT"
          docker --host=unix:///var/run/docker.sock inspect "$db" --format '{{.State.Running}}' | grep -qx true
          out="$RUNNER_TEMP/bootstrap-v3-$GITHUB_RUN_ID/BOOTSTRAP-QUARANTINED.NAO-APLICAR.sql"
          test -s "$out"
          docker --host=unix:///var/run/docker.sock exec -i "$db" psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < "$out"
          docker --host=unix:///var/run/docker.sock exec -i "$db" psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 < ../quarantine/verify_disposable.sql
          echo 'ONLY_QUARANTINED_CATALOG_TESTED=PASS; RELEASE_33_UNITS_NOT_APPLIED=TRUE'
      - name: Cleanup disposable resources, never uploaded
        if: always()
        working-directory: master-src
        run: |
          set +e
          bash tools/mission-02a5/network.sh unlock
          if [ -n "$AB_WORKDIR" ] && [ -d "$AB_WORKDIR/supabase" ] && command -v supabase >/dev/null; then
            export DOCKER_HOST=unix:///var/run/docker.sock
            supabase stop --workdir "$AB_WORKDIR" --no-backup >/dev/null
          fi
          if [ -n "$AB_WORKDIR" ] && [ -f "$AB_WORKDIR/relay.pid" ]; then kill "$(cat "$AB_WORKDIR/relay.pid")" 2>/dev/null; fi
          if [ -n "$AB_NETWORK" ]; then docker --host=unix:///var/run/docker.sock network rm "$AB_NETWORK" >/dev/null 2>&1; fi
          if [ -n "$AB_PROJECT" ]; then
            remaining=$(docker --host=unix:///var/run/docker.sock ps -aq --filter "label=com.supabase.cli.project=$AB_PROJECT")
            test -z "$remaining" || exit 1
          fi
          echo 'DISPOSABLE_CLEANUP=PASS; NO_ARTIFACT_UPLOAD; NO_HOSTED_DB'
